 conduta:'## Problemas ativos e hipóteses\n- Gonalgia direita subaguda com melhora parcial (EVA 8 → 4), provável sobrecarga femoropatelar; descartar lesão meniscal/ligamentar se houver bloqueio, instabilidade ou derrame progressivo.\n- Hipertensão arterial em uso de losartana: atenção ao uso de AINEs.\n\n## Conduta sugerida\n- Manter o plano de exercícios progressivo (fortalecimento de quadríceps e glúteos; controle de carga).\n- Analgesia: paracetamol como primeira linha; **alergia registrada a dipirona**; evitar AINEs prolongados pela hipertensão.\n- Considerar imagem (radiografia/ressonância) se não houver melhora em 6 semanas ou sinais de alerta.\n\n## Sinais de alerta e critérios de encaminhamento\n- Bloqueio articular, instabilidade, febre, derrame importante, dor noturna intensa → avaliação ortopédica.\n\n## Próximos passos e seguimento\n- Reavaliar em 2 semanas (meta: EVA ≤ 2 até 15/12/2026) e reforçar adesão (4 de 5 e 2 de 3 sessões na semana).\n\n## Diretrizes de referência\n- Protocolos e diretrizes do Ministério da Saúde e das sociedades brasileiras de ortopedia e reumatologia [verificar versão vigente].\n\n## Limitações desta sugestão\n- Sem exame físico estruturado nem imagem no registro; a decisão final é do médico.'+NOTE,

  const ST = [
    { t: 'Bem-vindo ao Talk.M3D', side: 'l', why: 'O que você está vendo', x: 'Este é o sistema <b>depois de instalado</b>, funcionando com dados fictícios. Tudo roda no seu navegador e nada é salvo. Use <b>Próximo</b> para percorrer as funcionalidades, ou escolha uma etapa na lista.', e: ['A tela atrás do guia é o login real do sistema.', 'Em cada etapa o guia abre a tela correspondente.'], go: async () => { window.__as = null; S.me = null; render(); } },
    { t: 'Entrar e criar conta', side: 'l', why: 'Tela de login', x: 'O login aceita <b>usuário ou e-mail</b>. O superusuário é o <b>root</b>. Se o cadastro público estiver ligado, aparece “Criar conta” (sempre como paciente, com ou sem aprovação, conforme definido na instalação). Depois de 8 tentativas erradas, a conta fica bloqueada por 15 minutos.', e: ['Entre digitando <b>root</b> no usuário (neste exemplo qualquer senha entra).', 'Clique em “Criar conta” e preencha o formulário.', 'Na etapa seguinte, o administrador aprova pedidos pendentes.'], go: async () => { window.__as = null; S.me = null; S.su = false; S.signup = 'approval'; render(); } },
    { t: '1. Primeiro acesso: assistente de instalação', side: 'r', why: 'Quando aparece', x: 'Na primeira vez que o endereço é aberto, o assistente verifica o servidor, testa cada chave de serviço (vídeo, IA, pagamento, SMS) e cria o administrador root e a equipe base. Nenhuma senha nasce pronta: todos recebem uma temporária.', e: ['Código de instalação: <b>DEMO-2026-ABCD</b> (no servidor real ele aparece no log).', 'Clique em “Aplicar migrações” e veja o item ficar verde.', 'Na etapa de credenciais, cole um texto com chaves e veja o que é reconhecido e o que é ignorado.', 'Na etapa de equipe: escolha a senha do <b>root</b> (em servidor local aparece a opção de teste root/arcano, bloqueada em servidor público) e se o cadastro público fica desativado, com aprovação ou aberto.'], go: async () => { window.__resetSetup && window.__resetSetup(); startWizard(true, { weakAllowed: true }); } },
    { t: '2. Administrador: cadastro de usuários', side: 'l', why: 'Quem usa o sistema', x: 'O administrador cria pessoas de qualquer tipo (médico, fisioterapeuta, enfermagem, nutrição, farmácia, cuidador, secretaria, funcionário, paciente), gera a <b>senha temporária</b> e vincula pacientes aos profissionais. A recepção só cadastra pacientes.', e: ['Crie um usuário e veja a senha temporária aparecer uma única vez.', 'Aprove ou recuse o pedido de cadastro pendente (“Novo Paciente”).', 'Em “configurar”, defina o <b>CRM</b> e a imagem da <b>assinatura</b> do médico: sem registro, não há receita.'], go: async () => { await as('admin@demo.com'); await A.view('users'); } },
    { t: '3. Administrador: integrações', side: 'l', why: 'Chaves de serviços', x: 'Depois da instalação, o administrador troca chaves de vídeo (Agora), IA (Gemini, OpenAI, Claude), PayPal e SMS por aqui. Cada chave é testada e fica cifrada no banco; nunca é exibida de novo.', e: ['Veja quais integrações estão configuradas.', 'Clique em “Testar” antes de salvar.', 'Em “Cadastro público”, desative ou mude o modo a qualquer momento.'], go: async () => { await as('admin@demo.com'); await A.view('integ'); } },
    { t: 'Menu em blocos e idiomas', side: 'l', why: 'Navegação', x: 'Os <b>ícones do trilho</b> (Usuários, Gestão, Canais internos, Relatórios e Conta) escolhem quais <b>blocos</b> aparecem ao lado, como uma árvore. Cada bloco tem cor própria e pode ser minimizado. Nos blocos de usuários, acima de 5 pessoas a lista rola e ganha uma <b>busca</b>. Você cria seus próprios grupos, move contatos (arrastando ou pelo menu ⋮) e restaura o formato original quando quiser. Em <b>Conta → Configurações</b> muda quantos usuários aparecem por bloco.<br><br>O seletor de <b>idioma</b> (português, espanhol, guarani, inglês e chinês) traduz a interface: o dicionário cobre o essencial e, no servidor real, a IA traduz o restante com cache. Nomes, mensagens e notas nunca são traduzidos nem enviados à IA.', e: ['Troque o idioma e veja os blocos e botões mudarem.', 'Arraste um paciente para um grupo novo ou use o ⋮.', 'Digite no campo de busca do bloco Pacientes.'], go: async () => { await as('medico@demo.com'); S.rail = 'users'; S.np = false; render(); } },
    { t: '4. Conversa com o paciente', side: 'l', why: 'Comunicação', x: 'Chat em tempo real no estilo dos mensageiros, com tradução por mensagem e destaque de termos de urgência. A videochamada usa o Agora (aqui ela fica indisponível).', e: ['Envie uma mensagem e aguarde a resposta automática.', 'Escreva “dor no peito” e veja o destaque.', 'Clique em “Traduzir” numa mensagem recebida.'], go: async () => { await peer('u2'); S.np = true; render(); } },

    { t: '8. Agenda visual', side: 'r', why: 'Horários', x: 'Cards de consultas e notas que você <b>arrasta</b> entre horários. Ao mover, o sistema pede uma <b>justificativa</b> (que pode ser desativada; só o administrador restabelece) e registra no histórico. Com um paciente em foco, o restante fica esmaecido.', e: ['Arraste um card para outro horário e escreva o motivo.', 'Clique em um card para ver detalhes, risco de falta e notas.', 'Use o “+” para criar uma consulta.'], go: async () => { await peer('u2'); await A.view('agenda'); S.np = true; render(); } },
    { t: '9. Receita com QR code', side: 'l', why: 'Verificação e baixa', x: 'Ao emitir, o médico define <b>quantos usos</b> a receita permite e a validade. O PDF sai com CRM, assinatura cadastrada e um QR code. Aqui você vê o QR de uma receita.', e: ['O QR leva à página de verificação (próxima etapa).', 'O seguimento mostra “usos 1/2” em barra animada.'], go: async () => { await peer('u2'); S.np = false; S.tab = 'res'; render(); A.qr('doc:d1'); } },
    { t: '10. Página aberta pelo QR da receita', side: 'r', why: 'Para a farmácia', x: 'Quem escaneia vê o <b>médico responsável</b>, o CRM, o texto e os usos. Confirma se a receita <b>foi utilizada ou não</b>. Passou do máximo: aparece “Número máximo de usos já utilizado” e os botões somem. O médico é notificado a cada baixa.', e: ['Digite um nome e clique em “Confirmar: a receita foi utilizada”.', 'Repita até esgotar os 2 usos.'], go: async () => { A.qclose(); publicPage('r', 'demo-ativa-0000000000'); } },
    { t: '11. Receita já esgotada', side: 'r', why: 'Controle de usos', x: 'Esta receita já usou todos os usos permitidos. A página informa isso de forma clara e não permite nova baixa. Receitas vencidas e canceladas também têm aviso próprio.', e: ['Note que o formulário de baixa não aparece.'], go: async () => { publicPage('r', 'demo-esgotada-00000000'); } },
    { t: '12. Rotina em sequência (QR)', side: 'r', why: 'Planos de treino', x: 'Rotinas têm etapas em <b>ordem fixa</b>: só a etapa atual pode ser concluída. Cada etapa concluída avisa o profissional; ao terminar todas, aparece “Todas as atividades concluídas” e o profissional é chamado para revisar o manejo.', e: ['Conclua a etapa atual repetidas vezes até o fim.', 'Observe o anel de progresso e a comemoração final.'], go: async () => { publicPage('p', 'demo-rotina-000000000'); } },
    { t: '13. Notificações do profissional', side: 'l', why: 'Revisar o manejo', x: 'Cada uso de receita e cada etapa ou conclusão de rotina chega como notificação ao profissional que emitiu, com o botão <b>Revisar manejo</b>, que abre o paciente. O sino mostra quantas são novas.', e: ['Se você executou as etapas anteriores, as novas notificações aparecem aqui.', 'Clique em “Revisar manejo”.'], go: async () => { await as('medico@demo.com'); await A.view('notif'); } },
    { t: '14. Histórico de atividades', side: 'l', why: 'Quem alterou o quê', x: 'Toda mudança na agenda fica registrada com responsável, horário, de → para e a justificativa. O administrador também vê quem desativou a justificativa e pode restabelecê-la.', e: ['Mova um card na agenda e volte aqui para ver o registro.'], go: async () => { await as('medico@demo.com'); await A.view('hist'); } },
    { t: '15. Relações em 3D', side: 'l', why: 'Visão de conjunto', x: 'Grafo que liga equipe, pacientes, consultas, terapias, solicitações e atividades, com <b>três níveis de complexidade</b>.', e: ['Arraste para girar e role para aproximar.', 'Troque o nível de complexidade e clique em um nó.'], go: async () => { await as('medico@demo.com'); await A.view('grafo'); } },
    { t: '16. A visão do paciente', side: 'l', why: 'Quem recebe o cuidado', x: 'O paciente vê só os próprios dados: conversa com os profissionais vinculados, agenda, exercícios com passo a passo, evolução e documentos. Pode concluir etapas da rotina com o botão correspondente.', e: ['Abra “Plano Terapêutico” e conclua uma etapa.', 'Note que não há acesso a relatórios nem a dados de outros pacientes.'], go: async () => { await as('paciente@demo.com'); S.np = false; S.tab = 'pl'; render(); } },

    [at('Menu em blocos') + 1, { t: 'Pacientes online e ícones', sel: ['.onbar', 'aside.list'], why: 'Menu lateral', x: 'Os blocos funcionam como as pastas de uma caixa de e-mail: recolha, expanda e reordene. As funções têm <b>ícones</b>, os tópicos de Gestão e Relatórios são separados e, no bloco de pacientes, aparece quantos estão <b>online</b> (com o filtro “Só online”).', e: ['Veja a bolinha verde ao lado de quem está online.', 'Use “Só online” para filtrar os pacientes.'], go: async () => { await as('medico@demo.com'); S.rail = 'users'; S.lo = true; render(); } }],
